name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs rather than let them finish, so a push to a branch
# already building reports on what is current instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# No marketplace actions beyond first-party checkout. A crate whose pitch is
# zero dependencies should not need a supply chain to test itself; rustup is
# already on every runner.
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}${{ matrix.components && format(' + {0}', matrix.components) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the platform this crate was never developed on, and path
          # normalization is exactly the part that differs by machine. Runners
          # install a minimal profile without `rust-src`, so rustc reports std
          # spans as `/rustc/<commit>/library/...` rather than the rustup path,
          # which exercises a normalization branch a dev machine never hits.
          - os: ubuntu-latest
            toolchain: stable
          # The MSRV in Cargo.toml, verified rather than asserted.
          - os: ubuntu-latest
            toolchain: "1.96.0"
          - os: macos-latest
            toolchain: stable
          # Path separators, drive prefixes and CRLF checkouts are all
          # Windows-only, and this is the one place they are exercised rather
          # than reasoned about. Without `rust-src`, std spans arrive as the
          # `/rustc/<commit>` prefix with a backslashed tail.
          - os: windows-latest
            toolchain: stable
          # The same, with the standard library's source installed, as it is on
          # a developer's machine for rust-analyzer. rustc then spells std
          # paths through the rustup sysroot rather than `/rustc/<commit>`, and
          # on Windows that path is backslashed from the drive letter on.
          - os: windows-latest
            toolchain: stable
            components: rust-src
    steps:
      - uses: actions/checkout@v7
      - name: Install ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc --version
      - name: Add ${{ matrix.components }}
        if: matrix.components
        run: rustup component add ${{ matrix.components }}
      # Runs the unit tests, the adversarial self-test suite, the UI suite
      # against its committed goldens, and the doctests. Every test binary runs
      # even after one fails, so a platform-specific failure in the unit tests
      # does not hide the ones in the suites after it.
      - run: cargo test --no-fail-fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  no-dependencies:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The crate's entire pitch, as a test rather than a claim in the README.
      # Dev-dependencies count: a `[dev-dependencies]` entry shows up in
      # `cargo tree` for anyone auditing the source.
      - name: cargo tree must print this crate and nothing else
        run: |
          tree=$(cargo tree --edges normal,build,dev --all-features)
          printf '%s\n' "$tree"
          count=$(printf '%s\n' "$tree" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::nocompile gained a dependency. The crate's entire pitch is that it has none, dev-dependencies included."
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catches a crate that builds in the working tree but not from the
      # published tarball, which is the form everyone else receives. Subsumes
      # `cargo package`, and also checks the metadata crates.io requires.
      - run: cargo publish --dry-run
